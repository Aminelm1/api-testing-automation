---
- name: Verification environnement DevOps
  hosts: local
  gather_facts: true

  tasks:
    - name: Afficher le systeme
      ansible.builtin.debug:
        msg: "Machine: {{ ansible_hostname }} - OS: {{ ansible_distribution }} {{ ansible_distribution_version }}"

    - name: Verifier Docker
      ansible.builtin.command: docker --version
      register: docker_version
      changed_when: false

    - name: Afficher version Docker
      ansible.builtin.debug:
        var: docker_version.stdout

    - name: Verifier kubectl
      ansible.builtin.command: kubectl version --client
      register: kubectl_version
      changed_when: false

    - name: Afficher version kubectl
      ansible.builtin.debug:
        var: kubectl_version.stdout

    - name: Verifier Jenkins
      ansible.builtin.command: systemctl is-active jenkins
      register: jenkins_status
      changed_when: false

    - name: Afficher statut Jenkins
      ansible.builtin.debug:
        var: jenkins_status.stdout

    - name: Verifier acces Kubernetes
      ansible.builtin.command: kubectl get nodes
      register: kubernetes_nodes
      changed_when: false

    - name: Afficher les nodes Kubernetes
      ansible.builtin.debug:
        var: kubernetes_nodes.stdout_lines
